kind = "video"
previewPath = "/chai-chasers-video/"
title = "Glee-fully Chai Chasers — Designathon Video"
description = "A 45-second 16:9 animated build-in-public video for the original browser game Glee-fully Chai Chasers. Features the cosmic Pacific-Northwest visual world, real gameplay concepts (Sparkle, cascades, Firefly Cascade, Treat Jar, UniGlee), Replit Design context, and an end card with the public game URL. Built for a Designathon showcase."
version = "1.0.0"
id = "artifacts/chai-chasers-video"
router = "path"

[[services]]
name = "web"
paths = [ "/chai-chasers-video/" ]
localPort = 22469

[services.development]
run = "pnpm --filter @workspace/chai-chasers-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chai-chasers-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/chai-chasers-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22469"
BASE_PATH = "/chai-chasers-video/"
