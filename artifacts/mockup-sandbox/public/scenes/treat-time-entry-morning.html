<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Treat Time Entry — Morning — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:390px;overflow:hidden;background:#06081a}</style>
</head>
<body>
<div class="cc-root">
  <div id="bg-layer" class="night-garden" aria-hidden="true"></div>
  <div class="cc-shell treat-time-main-mode">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="marquee-bulb" style="--blink-delay:0s"></span><span class="marquee-bulb" style="--blink-delay:.07s"></span><span class="marquee-bulb" style="--blink-delay:.14s"></span><span class="marquee-bulb" style="--blink-delay:.21s"></span><span class="marquee-bulb" style="--blink-delay:.28s"></span></div>
      <div class="marquee-row"><h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1></div>
      <div id="marquee-status" class="marquee-status"></div>
    </header>
    
    <main class="cabinet-frame treat-time-cabinet">
      <span class="ornament ornament-tl"></span><span class="ornament ornament-tr"></span><span class="ornament ornament-bl"></span><span class="ornament ornament-br"></span>
      <!-- #50 treat-time-entry-morning: div.treat-time-entry--main.treat-time-entry--morning appended to .cabinet-frame -->
      <div class="treat-time-entry treat-time-entry--main treat-time-entry--morning" style="animation:none;opacity:1">
        <div class="treat-time-entry-hand" aria-hidden="true">
          <!-- treatTimeHandSvg() inline (hand is hidden on --main variant per CSS) -->
          <svg viewBox="0 0 88 110" aria-hidden="true">
            <path d="M28 101c-7-7-9-19-6-31l6-24c1-5 8-5 9 0l1 14 2-34c0-6 8-6 9 0l1 31 2-39c0-6 8-6 9 0l1 38 3-28c1-6 9-5 9 1l-2 38c-1 16-7 26-18 34z" fill="#f5d576" stroke="#2d1f4c" stroke-width="4" stroke-linejoin="round"/>
            <path d="M24 69c-7-7-13-9-17-4-4 5 1 12 10 17" fill="none" stroke="#2d1f4c" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="treat-time-entry-copy">
          <div class="treat-time-entry-title">IT'S TREAT TIME!</div>
          <div class="treat-time-entry-sub">Phoebe's morning Chicken Comets are READY!</div>
          <div class="treat-time-entry-spins">6 free spins · every spin gets a treat toss</div>
        </div>
      </div>
      <!-- Main reel grid (hidden while entry overlay shows) -->
      <div id="reel-grid" class="reel-grid" role="img" aria-label="Treat Time reel board" style="display:none"></div>
    </main>
    <div class="companion-row">
      <div class="treat-jar-housing"><span class="treat-jar-title">Treat Jar</span><div class="treat-chips-row"><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>12</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 100%"></span></span>6</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 100%"></span></span>3</span></div></div>
      <div class="jar-meter jar-meter--inline" aria-label="Firefly cascade meter">
        <span class="jar-meter-kicker">Firefly Cascade</span>
        <div class="jar-meter-body"><strong class="jar-meter-count">2 / 6</strong></div>
      </div>
    </div>
    <div id="status-line" class="status-line" aria-live="polite">IT'S TREAT TIME! — Morning mode · 6 spins incoming</div>
    <footer class="bet-console">
      <span class="level-chip">Level 2</span>
      <button class="bet-adj-btn" disabled>−</button><button class="sparkle-btn" disabled>SPARKLE</button><button class="bet-adj-btn" disabled>+</button>
    </footer>

  </div>
</div>
</body>
</html>
