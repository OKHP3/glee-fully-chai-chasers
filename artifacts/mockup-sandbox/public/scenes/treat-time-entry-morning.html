<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Treat Time Entry — Morning — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:390px;overflow:hidden;background:#06081a}
/* Scene preview: show the hand graphic — override display:none and all clipping ancestors */
.treat-time-entry--main .treat-time-entry-hand{display:block!important}
.treat-time-entry--main{overflow:visible!important}
.treat-time-cabinet{overflow:visible!important}</style>
</head>
<body>
<div class="cc-root">
  <div id="bg-layer" class="night-garden" aria-hidden="true"></div>
  <div class="cc-shell treat-time-main-mode">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="marquee-bulb" style="--blink-delay:0s"></span><span class="marquee-bulb" style="--blink-delay:.07s"></span><span class="marquee-bulb" style="--blink-delay:.14s"></span><span class="marquee-bulb" style="--blink-delay:.21s"></span><span class="marquee-bulb" style="--blink-delay:.28s"></span></div>
      <div class="marquee-row"><h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1><button class="chrome-btn" aria-label="Open symbol guide and game rules" title="Symbol guide"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 0 5 23z"/><path d="M5 4.5v15M9 8h6M9 12h6"/></svg></button><button class="chrome-btn" aria-label="More information"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8.5" stroke-linecap="round" stroke-width="2.2"/><line x1="12" y1="11.5" x2="12" y2="17" stroke-linecap="round"/></svg></button><button class="chrome-btn" aria-label="Settings"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg></button></div>
      <div id="marquee-status" class="marquee-status"></div>
    </header>
    
    <main class="cabinet-frame treat-time-cabinet">
      <span class="ornament ornament-tl"></span><span class="ornament ornament-tr"></span><span class="ornament ornament-bl"></span><span class="ornament ornament-br"></span>
        <div class="cabinet-msg cabinet-msg--top" aria-label="Player progress"><span class="cabinet-msg__sparks"><span style="color:#f5d576;font-weight:700">Lvl 4</span><span style="color:#7a6a9a">·</span><span style="color:#c9aeff">347 <span style="color:#7a6a9a;font-weight:400">/ 500 Sparks</span></span><span class="cabinet-msg__sparks-bar"><span class="cabinet-msg__sparks-fill" style="width:69.4%"></span></span></span><span style="color:#7a6a9a;font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Treat Time · Morning</span></div>
      <!-- #50 treat-time-entry-morning: div.treat-time-entry--main.treat-time-entry--morning appended to .cabinet-frame -->
      <div class="treat-time-entry treat-time-entry--main treat-time-entry--morning" style="animation:none;opacity:1">
        <div class="treat-time-entry-hand" aria-hidden="true" style="display:block!important;position:relative!important;left:auto!important;bottom:auto!important;width:90px;flex-shrink:0;align-self:flex-end">
          <!-- treatTimeHandSvg() inline (hand is hidden on --main variant per CSS) -->
          <svg viewBox="0 0 88 110" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tth-fill" x1="0.3" y1="0" x2="0.75" y2="1">
                <stop offset="0%" stop-color="#fde9a8"/>
                <stop offset="100%" stop-color="#e8ab36"/>
              </linearGradient>
              <linearGradient id="tth-cuff" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#9461f0"/>
                <stop offset="100%" stop-color="#5b18c4"/>
              </linearGradient>
            </defs>
            <!-- Sleeve / cuff -->
            <rect x="18" y="93" width="52" height="17" rx="5" fill="url(#tth-cuff)" stroke="#2d1f4c" stroke-width="2.5"/>
            <rect x="18" y="93" width="52" height="6" rx="3" fill="rgba(255,248,238,.14)"/>
            <path d="M21 100 Q44 104 67 100" fill="none" stroke="#f2c84b" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
            <!-- Thumb -->
            <path d="M22 83 C13 80 6 71 8 61 C10 53 18 51 24 57 L24 75 Z" fill="url(#tth-fill)" stroke="#2d1f4c" stroke-width="3" stroke-linejoin="round"/>
            <!-- 4-finger + palm silhouette -->
            <path d="M22 90 L22 36 C22 28 33 28 33 36 L33 58 L33 20 C33 12 45 12 45 20 L45 58 L45 26 C45 18 57 18 57 26 L57 60 L57 40 C57 32 67 32 67 40 L67 76 C70 88 70 90 66 90 Z" fill="url(#tth-fill)" stroke="#2d1f4c" stroke-width="3.5" stroke-linejoin="round"/>
            <!-- Finger valley lines -->
            <line x1="33" y1="52" x2="33" y2="58" stroke="#2d1f4c" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
            <line x1="45" y1="52" x2="45" y2="58" stroke="#2d1f4c" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
            <line x1="57" y1="54" x2="57" y2="60" stroke="#2d1f4c" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
            <!-- Knuckle highlights -->
            <ellipse cx="27" cy="59" rx="3" ry="2" fill="rgba(255,248,238,.44)"/>
            <ellipse cx="39" cy="57" rx="3" ry="2" fill="rgba(255,248,238,.44)"/>
            <ellipse cx="51" cy="57" rx="3" ry="2" fill="rgba(255,248,238,.44)"/>
            <ellipse cx="62" cy="61" rx="2.5" ry="2" fill="rgba(255,248,238,.44)"/>
            <!-- Palm highlight streak -->
            <path d="M28 78 Q44 74 62 78" fill="none" stroke="rgba(255,248,238,.28)" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="treat-time-entry-copy">
          <div class="treat-time-entry-title">IT'S TREAT TIME!</div>
          <div class="treat-time-entry-sub">Phoebe's morning Chicken Comets are READY!</div>
          <div class="treat-time-entry-spins">6 free spins · every spin gets a treat toss</div>
        </div>
      </div>
      <!-- Main reel grid (hidden while entry overlay shows) -->
      <div id="reel-grid" class="reel-grid" role="img" aria-label="Treat Time reel board" style="display:none"></div>
    
        <div class="cabinet-msg cabinet-msg--bottom" aria-live="polite"><span style="color:#8b7eb8">✦ Your morning treat is waiting</span></div>
      </main>
    <div class="companion-row">
      <div class="treat-jar-housing"><span class="treat-jar-title">Treat Jar</span><div class="treat-chips-row"><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>12</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 100%"></span></span>6</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 100%"></span></span>3</span></div></div>
      <div class="jar-meter jar-meter--inline" aria-label="Firefly cascade meter">
        <span class="jar-meter-kicker">Firefly Cascade</span>
        <div class="jar-meter-body"><strong class="jar-meter-count">2 / 6</strong></div>
      </div>
    </div>
    <div id="status-line" class="status-line" aria-live="polite">IT'S TREAT TIME! — Morning mode · 6 spins incoming</div>
    <footer class="bet-console">
      <span class="level-chip">Level 2</span>
      <button class="bet-adj-btn" disabled>−</button><button class="sparkle-btn" disabled>SPARKLE</button><button class="bet-adj-btn" disabled>+</button>
    </footer>

  </div>
</div>
</body>
</html>
