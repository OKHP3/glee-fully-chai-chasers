<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>AskJamie Bubble (Daily Coin Grant) — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:1280px;height:900px;overflow:hidden;background:#06081a}.cc-root{width:1280px;height:900px}</style>
</head>
<body>
<div class="cc-root" data-theme="dark" data-reduced-motion="false">
  <div class="night-garden" id="bg-layer" aria-hidden="true">
    <div class="aurora-ribbons"><span></span><span></span><span></span></div>
    <div class="star star-slow" style="top:4%;left:3%;animation-delay:0s"></div>
    <div class="star star-fast" style="top:21%;left:44%;animation-delay:.5s"></div>
    <div class="star star-slow" style="top:9%;left:77%;animation-delay:1s"></div>
    <div class="firefly" style="top:47%;left:8%;animation-delay:0s"></div>
    <div class="firefly" style="top:59%;left:61%;animation-delay:.7s"></div>
  </div>
  <div class="cc-shell">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span><span class="bulb" style="animation-delay:.72s"></span><span class="bulb" style="animation-delay:.9s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span><span class="bulb" style="animation-delay:.72s"></span><span class="bulb" style="animation-delay:.9s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span></div>
      <div class="marquee-row">
        <h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1>
        <button class="chrome-btn" aria-label="Open symbol guide and game rules" title="Symbol guide"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="#f5d576" stroke-width="1.8" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 0 5 23z"/><path d="M5 4.5v15M9 8h6M9 12h6"/></svg></button>
        <button class="chrome-btn" aria-label="Settings"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="#f5d576" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg></button>
      </div>
      <div id="marquee-status" class="marquee-status" aria-live="polite">AskJamie slipped you +500 coins!</div>
    </header>
    <div class="cabinet-shell">
      <div class="bonus-banner"><span class="level-chip level-chip--cabinet" aria-label="Player level">Lvl 4<em>320/500 Sparks</em></span></div>
      <div class="cabinet-shell-divider"></div>
      <main class="cabinet-frame">
        <span class="ornament ornament-tl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-tr"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-bl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-br"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <div id="reel-grid" class="reel-grid" role="img" aria-label="Reel board">
          <div class="reel-col" data-reel="0"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="1"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="2"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="3"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
          <div class="reel-col" data-reel="4"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div></div>
          <svg class="payline-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </main>
    </div>
    <div class="companion-row">
      <div id="treat-jar" aria-label="Treat Jar" class="treat-jar-housing">
        <span class="treat-jar-title">Treat Jar</span>
        <div class="treat-chips-row">
          <span title="Chicken Comets" class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>2</span>
          <span title="Salmon Stars" class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 100%"></span></span>5</span>
          <span title="Bougie Bites" class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 100%"></span></span>0</span>
        </div>
      </div>
      <div class="jar-meter jar-meter--inline" aria-label="Firefly cascade meter">
        <span class="jar-meter-kicker">Firefly Cascade</span>
        <div class="jar-meter-body">
          <div class="jar-meter-icon" id="jar-icon">
            <svg viewBox="0 0 58 52" aria-hidden="true"><ellipse cx="29" cy="42" rx="16" ry="7" fill="rgba(245,213,118,.18)" stroke="rgba(245,213,118,.55)" stroke-width="1.4"/><rect x="13" y="10" width="32" height="34" rx="10" fill="rgba(12,28,58,.6)" stroke="rgba(245,213,118,.55)" stroke-width="1.4"/><circle cx="22" cy="28" r="3" fill="#ffe27a" opacity=".8"/><circle cx="36" cy="22" r="3" fill="#ffe27a" opacity=".8"/></svg>
          </div>
          <strong id="meter-count" class="jar-meter-count">2 / 6</strong>
        </div>
      </div>
      <!-- AskJamie perch with bubble visible (#13 board-askjamie-bubble) -->
      <button id="askjamie-perch" aria-label="AskJamie — tap for daily bonus" class="askjamie-housing">
        <div class="askjamie-icon">
          <picture class="askjamie-picture"><img src="../assets/askjamie-avatar.jpg" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></picture>
        </div>
        <span class="askjamie-label">AskJamie</span>
        <div id="askjamie-bubble" class="askjamie-bubble askjamie-bubble--visible">
          <span class="aj-msg">+500 coins! 🎉 Want to learn more about us?</span>
          <a class="aj-link" href="#" target="_blank" rel="noopener noreferrer">Visit us →</a>
        </div>
      </button>
    </div>
    <div id="status-line" class="status-line" aria-live="polite"></div>
    <footer class="bet-console">
      <div class="coin-chip" aria-label="Glee-coin balance">12,980<em>coins</em></div>
      <div class="flex-1"></div>
      <button class="chrome-btn" aria-label="Decrease bet">−</button>
      <span class="bet-display" id="bet-display">40</span>
      <button class="chrome-btn" aria-label="Increase bet">+</button>
      <button id="sparkle-btn" class="sparkle-btn"><span>SPARKLE!</span></button>
    </footer>
  </div>
</div>
</body>
</html>
