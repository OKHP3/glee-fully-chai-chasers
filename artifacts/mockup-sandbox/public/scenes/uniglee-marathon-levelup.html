<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>UniGlee Marathon — Level-Up — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:1280px;height:900px;overflow:hidden;background:#06081a}.cc-root{width:1280px;height:900px}</style>
</head>
<body>
<div class="cc-root">
  <div id="bg-layer" class="night-garden aurora" aria-hidden="true"></div>
  <!-- UniGlee marathon context: We're Multiplying act is ending, level-up fires between chapters -->
  <div class="cc-shell">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="marquee-bulb" style="--blink-delay:0s"></span><span class="marquee-bulb" style="--blink-delay:.07s"></span><span class="marquee-bulb" style="--blink-delay:.14s"></span><span class="marquee-bulb" style="--blink-delay:.21s"></span><span class="marquee-bulb" style="--blink-delay:.28s"></span></div>
      <div class="marquee-row"><h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1></div>
      <div class="marquee-status">LEVEL 6!</div>
    </header>
    <!-- Marathon banner still showing previous act (before next chapter loads) -->
    <div id="bonus-banner" class="bonus-banner bonus-banner--active" aria-live="polite">
      <div class="bonus-banner-heading">
        <span class="bonus-banner-kicker">UniGlee · Chapter 3</span>
        <strong class="bonus-banner-title">We&#8217;re Multiplying</strong>
      </div>
      <div class="bonus-banner-stats">15 of 15 spins complete</div>
    </div>
    <div class="sidebar-left"><div class="treat-jar-housing"><span class="treat-jar-title">Treat Jar</span><div class="treat-chips-row"><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>2</span></div></div></div>
    <main class="cabinet-frame">
      <span class="ornament ornament-tl"></span><span class="ornament ornament-tr"></span><span class="ornament ornament-bl"></span><span class="ornament ornament-br"></span>
      <!-- Faded board beneath the level-up overlay -->
      <div id="reel-grid" class="reel-grid" role="img" aria-label="Reel board" style="opacity:0.25">
        <div class="reel-col" data-reel="0"><div class="cell" data-reel="0" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-reel="0" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-reel="0" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-reel="0" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
        <div class="reel-col" data-reel="1"><div class="cell" data-reel="1" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-reel="1" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div><div class="cell" data-reel="1" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div><div class="cell" data-reel="1" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 66.67%"></span></div></div>
        <div class="reel-col" data-reel="2"><div class="cell" data-reel="2" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-reel="2" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-reel="2" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%"></span></div><div class="cell" data-reel="2" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%"></span></div></div>
        <div class="reel-col" data-reel="3"><div class="cell" data-reel="3" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-reel="3" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-reel="3" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-reel="3" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
        <div class="reel-col" data-reel="4"><div class="cell" data-reel="4" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></div><div class="cell" data-reel="4" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-reel="4" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-reel="4" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div></div>
      </div>
    </main>
    <div class="sidebar-right"><div class="firefly-cascade-meter"><div class="cascade-meter-fill" style="height:90%"></div></div></div>
    <div class="hud-row"><span class="level-chip">Level 6</span><div class="status-line">LEVEL 6! · +1,200 coins · Tap to continue</div><div class="bet-console"><button class="bet-adj-btn" disabled>−</button><button class="sparkle-btn" disabled>SPARKLE</button><button class="bet-adj-btn" disabled>+</button></div></div>
  </div>
  <!-- Level-up overlay — shown between UniGlee acts after maybeLevelUpAfterBonus fires -->
  <!-- Cat chosen at even odds; quip includes catName -->
  <div class="levelup-overlay" aria-live="assertive" aria-label="Level 6 reached!" style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center">
    <div class="levelup-saucer levelup-saucer--from-right" aria-hidden="true">
      <svg viewBox="0 0 64 40" style="height:100%;width:100%;filter:drop-shadow(0 0 6px rgba(201,155,255,0.55)) drop-shadow(0 3px 3px rgba(0,0,0,0.4))">
        <defs><radialGradient id="sDome4" cx="35%" cy="25%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#d6ffe8"/><stop offset="100%" stop-color="#3ba296"/></radialGradient><linearGradient id="sHull4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e6def7"/><stop offset="55%" stop-color="#8f86b8"/><stop offset="100%" stop-color="#4a4270"/></linearGradient></defs>
        <ellipse cx="32" cy="27" rx="30" ry="7" fill="url(#sHull4)" stroke="#20163a" stroke-width="1.3"/>
        <ellipse cx="32" cy="24" rx="30" ry="6" fill="#ffffff" opacity="0.18"/>
        <ellipse cx="32" cy="17" rx="15" ry="13" fill="url(#sDome4)" stroke="#20163a" stroke-width="1.3"/>
        <ellipse cx="27" cy="11" rx="5" ry="3.4" fill="#ffffff" opacity="0.55"/>
        <circle cx="10" cy="27" r="1.8" class="saucer-light-a" fill="#ffe27a"/>
        <circle cx="22" cy="29.5" r="1.8" class="saucer-light-b" fill="#ff9ecb"/>
        <circle cx="42" cy="29.5" r="1.8" class="saucer-light-a" fill="#8ec9ff"/>
        <circle cx="54" cy="27" r="1.8" class="saucer-light-b" fill="#ffe27a"/>
      </svg>
    </div>
    <div class="levelup-burst" aria-hidden="true">
      <span class="levelup-spark" style="--angle:0deg;--dist:42px;width:6px;height:6px;background:#f5d576;animation-delay:.45s"></span>
      <span class="levelup-spark" style="--angle:26deg;--dist:36px;width:4px;height:4px;background:#ff9ecb;animation-delay:.461s"></span>
      <span class="levelup-spark" style="--angle:51deg;--dist:44px;width:5px;height:5px;background:#6bd6c9;animation-delay:.472s"></span>
      <span class="levelup-spark" style="--angle:77deg;--dist:38px;width:6px;height:6px;background:#c99bff;animation-delay:.483s"></span>
      <span class="levelup-spark" style="--angle:103deg;--dist:46px;width:4px;height:4px;background:#f5d576;animation-delay:.494s"></span>
      <span class="levelup-spark" style="--angle:129deg;--dist:40px;width:5px;height:5px;background:#ff9ecb;animation-delay:.505s"></span>
      <span class="levelup-spark" style="--angle:154deg;--dist:34px;width:7px;height:7px;background:#6bd6c9;animation-delay:.516s"></span>
      <span class="levelup-spark" style="--angle:180deg;--dist:48px;width:5px;height:5px;background:#f5d576;animation-delay:.527s"></span>
      <span class="levelup-spark" style="--angle:206deg;--dist:38px;width:4px;height:4px;background:#c99bff;animation-delay:.538s"></span>
      <span class="levelup-spark" style="--angle:232deg;--dist:42px;width:6px;height:6px;background:#ff9ecb;animation-delay:.549s"></span>
      <span class="levelup-spark" style="--angle:257deg;--dist:36px;width:5px;height:5px;background:#6bd6c9;animation-delay:.56s"></span>
      <span class="levelup-spark" style="--angle:283deg;--dist:44px;width:4px;height:4px;background:#f5d576;animation-delay:.571s"></span>
      <span class="levelup-spark" style="--angle:309deg;--dist:40px;width:6px;height:6px;background:#c99bff;animation-delay:.582s"></span>
      <span class="levelup-spark" style="--angle:334deg;--dist:46px;width:5px;height:5px;background:#ff9ecb;animation-delay:.593s"></span>
    </div>
    <div class="levelup-msg" role="status">
      <div class="levelup-msg-level">LEVEL 6!</div>
      <div class="levelup-msg-quip">Phoebe zoomed in just to celebrate!</div>
      <div class="levelup-msg-coins">+1,200 coins</div>
      <div class="levelup-msg-hint">Tap to continue</div>
    </div>
  </div>
</div>
</body>
</html>
