<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Joey Laundry — Combined Strike — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:390px;overflow:hidden;background:#06081a}</style>
</head>
<body>
<div class="cc-root">
  <div id="bg-layer" class="night-garden aurora" aria-hidden="true"></div>
  <!-- Joey Laundry: combined strike — sock drop and paw strike land on the same reel (reel 2) -->
  <div class="joey-laundry-overlay" role="region" aria-label="Joey's Laundry Helper sub-bonus" style="position:absolute;inset:0;z-index:10">
    <div class="night-garden aurora" aria-hidden="true" style="position:absolute;inset:0"></div>
    <div style="position:relative;z-index:10;height:100%;width:100%;display:flex;flex-direction:column" class="cc-shell free-spins-shell joey-laundry-shell">
      <header class="marquee joey-laundry-header">
        <div class="marquee-bulbs" aria-hidden="true"><span class="marquee-bulb" style="--blink-delay:0s"></span><span class="marquee-bulb" style="--blink-delay:.07s"></span><span class="marquee-bulb" style="--blink-delay:.14s"></span><span class="marquee-bulb" style="--blink-delay:.21s"></span><span class="marquee-bulb" style="--blink-delay:.28s"></span></div>
        <div class="marquee-row">
          <span class="level-chip">UniGlee · Chapter 1</span>
          <h1 class="marquee-title">Joey&#8217;s Laundry Helper</h1><button class="chrome-btn" aria-label="Open symbol guide and game rules" title="Symbol guide"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 0 5 23z"/><path d="M5 4.5v15M9 8h6M9 12h6"/></svg></button><button class="chrome-btn" aria-label="More information"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8.5" stroke-linecap="round" stroke-width="2.2"/><line x1="12" y1="11.5" x2="12" y2="17" stroke-linecap="round"/></svg></button><button class="chrome-btn" aria-label="Settings"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg></button>
        </div>
      </header>
      <div class="jar-meter joey-laundry-meter">
        <div class="jar-meter-text">Laundry spin <span id="laundry-index">9</span> of <span id="laundry-total">10</span> · Round win: <span id="laundry-round-win">0</span></div>
      </div>
      <main class="cabinet-frame joey-laundry-cabinet" style="position:relative">
        <span class="ornament ornament-tl"></span><span class="ornament ornament-tr"></span><span class="ornament ornament-bl"></span><span class="ornament ornament-br"></span>
        <div class="cabinet-msg cabinet-msg--top" aria-label="Player progress"><span class="cabinet-msg__sparks"><span style="color:#f5d576;font-weight:700">Lvl 4</span><span style="color:#7a6a9a">·</span><span style="color:#c9aeff">347 <span style="color:#7a6a9a;font-weight:400">/ 500 Sparks</span></span><span class="cabinet-msg__sparks-bar"><span class="cabinet-msg__sparks-fill" style="width:69.4%"></span></span></span><span style="color:#7a6a9a;font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Joey's Laundry · Bonus active</span></div>
        <div class="joey-laundry-perch" aria-hidden="true">
          <span class="cat-pop-asset cat-pop-asset--joey cat-pop-asset--assist" style="background-image:url('../assets/joey-phoebe-wilds.png');background-image:image-set(url('../assets/optimized/joey-phoebe-wilds.webp') type('image/webp'),url('../assets/joey-phoebe-wilds.png') type('image/png'));background-position:0% 50%" role="img" aria-label="Joey"></span>
        </div>
        <!-- Combined strike on reel 1 (board reel 2): full column Joey wilds, row 0 has ×3 multiplier -->
        <div id="laundry-grid" class="reel-grid" role="img" aria-label="Laundry reel board">
          <div class="reel-col" data-reel="0"><div class="cell" data-reel="0" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-reel="0" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-reel="0" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-reel="0" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
          <!-- Reel 1: sock drop (full column wilds) + paw strike on row 0 (×3 multiplier) — same-reel combined -->
          <div class="reel-col" data-reel="1">
            <div class="cell multiplier-wild win-flash" data-reel="1" data-row="0">
              <span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/special-symbol-atlas.png');background-size:400% 200%;background-position:33.33% 0%"></span>
              <span class="multiplier-badge" aria-label="3 times wild">×3</span>
            </div>
            <div class="cell" data-reel="1" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/special-symbol-atlas.png');background-size:400% 200%;background-position:33.33% 0%"></span></div>
            <div class="cell" data-reel="1" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/special-symbol-atlas.png');background-size:400% 200%;background-position:33.33% 0%"></span></div>
            <div class="cell" data-reel="1" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/special-symbol-atlas.png');background-size:400% 200%;background-position:33.33% 0%"></span></div>
          </div>
          <div class="reel-col" data-reel="2"><div class="cell" data-reel="2" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-reel="2" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-reel="2" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%"></span></div><div class="cell" data-reel="2" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="3"><div class="cell" data-reel="3" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-reel="3" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-reel="3" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-reel="3" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
          <div class="reel-col" data-reel="4"><div class="cell" data-reel="4" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></div><div class="cell" data-reel="4" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-reel="4" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-reel="4" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div></div>
        </div>
        <!-- Effect layer: both sock column (is-landed) and paw SVG on the same reel -->
        <div class="joey-laundry-effect-layer" style="position:absolute;inset:0;pointer-events:none">
          <div class="joey-laundry-sock-column is-landed" style="position:absolute;left:20%;top:0;width:20%;height:85%;opacity:0.7"></div>
          <div class="joey-laundry-paw" style="position:absolute;left:19%;top:3%;width:13%;height:18%;opacity:0.95">
            <svg viewBox="0 0 88 110" aria-hidden="true"><path d="M22 82c-7-5-8-14-3-20 4-4 9-4 14-1-4-12-3-22 3-24 6-2 9 4 11 14 0-16 4-23 10-22 6 1 7 8 6 21 4-10 9-13 14-10 5 4 2 13-1 22 6-5 12-3 14 2 3 7-4 16-12 23-9 8-18 12-31 9z" fill="#9fe8c5" stroke="#2d1f4c" stroke-width="4" stroke-linejoin="round"/></svg>
          </div>
          <div class="joey-laundry-sock" style="position:absolute;left:21%;top:75%;width:11%;opacity:0.85">
            <svg viewBox="0 0 58 78" aria-hidden="true"><path d="M17 5h24v32c0 8 4 13 12 19-3 12-14 17-28 13C11 66 7 57 14 47l3-6z" fill="#f5d576" stroke="#2d1f4c" stroke-width="4" stroke-linejoin="round"/><path d="M17 15h24M17 26h24" stroke="#e8a5b8" stroke-width="5" stroke-linecap="round"/></svg>
          </div>
        </div>
      
        <div class="cabinet-msg cabinet-msg--bottom" aria-live="polite"><span style="color:#8b7eb8">✦ Paw strike + sock drop combo!</span></div>
      </main>
      <div id="laundry-status" class="status-line" aria-live="polite">Joey caught a sock and enhanced reel 2 with a 3 times wild.</div>
    </div>
  </div>
</div>
</body>
</html>
