<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Cascade — Beam-Up Removal — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:1280px;height:900px;overflow:hidden;background:#06081a}.cc-root{width:1280px;height:900px}</style>
</head>
<body>
<div class="cc-root" data-theme="dark" data-reduced-motion="false">
  <div class="night-garden" id="bg-layer" aria-hidden="true">
    <div class="aurora-ribbons"><span></span><span></span><span></span></div>
    <div class="star star-slow" style="top:4%;left:3%"></div>
    <div class="star star-fast" style="top:21%;left:44%"></div>
    <!-- saucer beams active (.beaming) during beam-up step -->
    <div class="saucer-unit" data-saucer="0" style="top:4%;left:8%;animation-delay:0s">
      <div class="saucer-beam beaming"></div>
      <div class="saucer-art"><svg viewBox="0 0 64 40" style="height:100%;width:100%"><defs><radialGradient id="sD0" cx="35%" cy="25%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#ffe0c2"/><stop offset="100%" stop-color="#c99bff"/></radialGradient><linearGradient id="sH0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e6def7"/><stop offset="55%" stop-color="#8f86b8"/><stop offset="100%" stop-color="#4a4270"/></linearGradient></defs><ellipse cx="32" cy="27" rx="30" ry="7" fill="url(#sH0)"/><ellipse cx="32" cy="17" rx="15" ry="13" fill="url(#sD0)"/><circle cx="10" cy="27" r="1.8" class="saucer-light-a" fill="#ffe27a"/><circle cx="54" cy="27" r="1.8" class="saucer-light-b" fill="#ffe27a"/></svg></div>
    </div>
    <div class="saucer-unit" data-saucer="2" style="top:5%;left:50%;animation-delay:1.6s">
      <div class="saucer-beam beaming"></div>
      <div class="saucer-art"><svg viewBox="0 0 64 40" style="height:100%;width:100%"><defs><radialGradient id="sD2" cx="35%" cy="25%" r="75%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#c2e8ff"/><stop offset="100%" stop-color="#9bddff"/></radialGradient><linearGradient id="sH2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d0f0ff"/><stop offset="55%" stop-color="#6ab8d8"/><stop offset="100%" stop-color="#2a6070"/></linearGradient></defs><ellipse cx="32" cy="27" rx="30" ry="7" fill="url(#sH2)"/><ellipse cx="32" cy="17" rx="15" ry="13" fill="url(#sD2)"/><circle cx="10" cy="27" r="1.8" class="saucer-light-a" fill="#9fe8c5"/><circle cx="54" cy="27" r="1.8" class="saucer-light-b" fill="#9fe8c5"/></svg></div>
    </div>
  </div>
  <div class="cc-shell">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span><span class="bulb" style="animation-delay:.72s"></span><span class="bulb" style="animation-delay:.9s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span><span class="bulb" style="animation-delay:.72s"></span><span class="bulb" style="animation-delay:.9s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.18s"></span><span class="bulb" style="animation-delay:.36s"></span><span class="bulb" style="animation-delay:.54s"></span></div>
      <div class="marquee-row"><h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1></div>
      <div class="marquee-status" aria-live="polite"></div>
    </header>
    <div class="cabinet-shell">
      <div class="bonus-banner"><span class="level-chip level-chip--cabinet" aria-label="Player level">Lvl 4<em>320/500 Sparks</em></span></div>
      <div class="cabinet-shell-divider"></div>
      <main class="cabinet-frame">
        <span class="ornament ornament-tl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-tr"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-bl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <span class="ornament ornament-br"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <!-- #39 cascade-beam-up: winning cells have beam-up, saucer beams are .beaming -->
        <div id="reel-grid" class="reel-grid" role="img" aria-label="Reel board">
          <div class="reel-col" data-reel="0"><div class="cell beam-up" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="1"><div class="cell beam-up" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="2"><div class="cell beam-up" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%"></span></div></div>
          <div class="reel-col" data-reel="3"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 66.67%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%"></span></div></div>
          <div class="reel-col" data-reel="4"><div class="cell" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></div><div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%"></span></div><div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%"></span></div><div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%"></span></div></div>
          <svg class="payline-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </main>
    </div>
    <div class="companion-row">
      <div class="treat-jar-housing" aria-label="Treat Jar"><span class="treat-jar-title">Treat Jar</span><div class="treat-chips-row"><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>3</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 100%"></span></span>7</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 100%"></span></span>1</span></div></div>
      <div class="jar-meter jar-meter--inline" aria-label="Firefly cascade meter"><span class="jar-meter-kicker">Firefly Cascade</span><div class="jar-meter-body"><div class="jar-meter-icon"><svg viewBox="0 0 58 52" aria-hidden="true"><ellipse cx="29" cy="42" rx="16" ry="7" fill="rgba(245,213,118,.18)" stroke="rgba(245,213,118,.55)" stroke-width="1.4"/><rect x="13" y="10" width="32" height="34" rx="10" fill="rgba(12,28,58,.6)" stroke="rgba(245,213,118,.55)" stroke-width="1.4"/><circle cx="22" cy="28" r="3" fill="#ffe27a" opacity=".8"/></svg></div><strong class="jar-meter-count">1 / 6</strong></div></div>
      <button class="askjamie-housing" aria-label="AskJamie — tap for daily bonus"><div class="askjamie-icon"><picture class="askjamie-picture"><img src="../assets/askjamie-avatar.jpg" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></picture></div><span class="askjamie-label">AskJamie</span><div class="askjamie-bubble" aria-hidden="true"></div></button>
    </div>
    <div class="status-line" aria-live="polite"></div>
    <footer class="bet-console">
      <div class="coin-chip" aria-label="Glee-coin balance">12,480<em>coins</em></div>
      <div class="flex-1"></div>
      <button class="chrome-btn" aria-label="Decrease bet" disabled>−</button>
      <span class="bet-display">40</span>
      <button class="chrome-btn" aria-label="Increase bet" disabled>+</button>
      <button class="sparkle-btn is-spinning"><span>SPARKLE!</span></button>
    </footer>
  </div>
</div>
</body>
</html>
