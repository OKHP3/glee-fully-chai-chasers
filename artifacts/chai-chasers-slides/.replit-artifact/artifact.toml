kind = "slides"
previewPath = "/chai-chasers-slides/"
title = "Glee-fully Chai Chasers — Portfolio Deck"
description = "A 12-slide portfolio presentation showcasing Glee-fully Chai Chasers, a TypeScript browser slot game with original artwork, companion characters, and chai education. Designed in the game's brand palette: deep indigo, butter-gold, and mint."
version = "1.0.0"
id = "artifacts/chai-chasers-slides"
router = "path"

[[services]]
name = "web"
paths = [ "/chai-chasers-slides/" ]
localPort = 20742

[services.development]
run = "pnpm --filter @workspace/chai-chasers-slides run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chai-chasers-slides", "run", "build" ]
serve = "static"
publicDir = "artifacts/chai-chasers-slides/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20742"
BASE_PATH = "/chai-chasers-slides/"
