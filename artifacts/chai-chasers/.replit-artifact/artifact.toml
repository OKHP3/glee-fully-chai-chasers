kind = "web"
previewPath = "/"
title = "Glee-fully Chai Chasers"
description = "The original Glee-fully Chai Chasers browser game — a cozy collectible slot experience with Joey and Phoebe cats, cosmic chai, and original synthesized audio."
version = "1.0.0"
id = "artifacts/chai-chasers"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18364

[services.development]
run = "pnpm --filter @workspace/chai-chasers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chai-chasers", "run", "build" ]
serve = "static"
publicDir = "artifacts/chai-chasers/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18364"
BASE_PATH = "/"
