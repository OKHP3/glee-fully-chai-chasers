name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies — a failure here means the lockfile and package.json disagree
        run: npm ci --no-audit --no-fund

      - name: Check mockup component exports — catch missing scene files before merge
        run: |
          npm install -g pnpm@10.26.1
          pnpm install --filter @workspace/mockup-sandbox --frozen-lockfile
          pnpm --filter @workspace/mockup-sandbox run check-exports

      - name: Typecheck mockup canvas components — catch TS errors before merge
        working-directory: artifacts/mockup-sandbox
        run: npm run typecheck

      - name: Run full test suite — catch game logic and UI regressions before merge
        run: npm test

      - name: Run slot engine unit tests — catch regressions before merge
        run: npx vitest run src/engine

      - name: Validate symbol atlas assets — catch a missing or stale generated asset before it ships
        run: npm run validate:assets
      - name: Confirm treat-time hand SVG matches board.ts — catch scene/source drift before merge
        run: npm run validate:hand-svg
      - name: Confirm SymbolReference pays match PAYTABLE — catch drift after a rebalance
        run: npm run validate:symbol-pays
      - name: Confirm SymbolReference reel chips match reels.ts — catch placement drift before it misleads a designer
        run: npm run validate:symbol-reels
      - name: Confirm every canvas iframe is in the refresh registry — a missing entry breaks on the next domain change
        run: npm run validate:canvas-iframes && node scripts/check-canvas-iframe-registry.mjs --self-test
      - name: Confirm every sandbox scene file has a canvas gallery frame
        run: npm run validate:scene-coverage
      - name: Catch a dead export slipping back into symbols.ts or board.ts
        run: npm run validate:dead-exports && node scripts/check-dead-exports.mjs --self-test
      - name: Catch a dead CSS selector slipping back into src/style.css
        run: npm run validate:dead-css && node scripts/check-dead-css.mjs --self-test
      - name: Catch a stale Keepsake Constellation 2×2 size claim in docs or scenes
        run: npm run validate:keepsake-size
      - name: Confirm cabinet-strip Sparks values match SPARKS table — catch a drifted scene before merge
        run: npm run validate:cabinet-strips

      - name: Confirm no Google Fonts CDN links in shipped artifacts — keep offline-demo resilience
        run: |
          # CDN font links (fonts.googleapis.com / fonts.gstatic.com) are forbidden in
          # anything that ships: they silently break the offline demo, add a
          # third-party request the analytics/privacy policy does not allow, and
          # undo the self-hosted @font-face work in each artifact's public/fonts/.
          # Fonts must be self-hosted woff2 files loaded via @font-face.
          #
          # Scope: every deployable input — root game (index.html, src/, public/)
          # and every artifact's index.html, src/, and public/, with no exclusions.
          # The mockup sandbox is covered too: its public/scenes/ HTML is copied
          # into the game's shipped dist/scenes/ at build time, and the sandbox
          # itself is a registered artifact. Case-insensitive so an odd-cased
          # host cannot slip through.
          matches=$(grep -rniE "fonts\.googleapis\.com|fonts\.gstatic\.com" \
            index.html src/ public/ \
            artifacts/*/index.html artifacts/*/src/ artifacts/*/public/ \
            --include='*' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Google Fonts CDN reference found in shipped code. Self-host the font in public/fonts/ with @font-face instead:"
            echo "$matches"
            exit 1
          fi
          echo "No Google Fonts CDN references in shipped artifacts."
      - name: Build — catch TypeScript and bundler errors before merge
        run: npm run build

      - name: Verify How It Works scene files are present in dist
        run: |
          missing=()
          for scene in \
            bold-chai-pump.html \
            cat-visit-joey.html \
            cat-visit-phoebe.html \
            doorbell-panic.html \
            free-spins-session.html \
            game-base.html \
            joey-laundry.html \
            keepsake-memory.html \
            phoebe-lap-quest.html \
            spin-wheel.html \
            treat-time.html \
            uniglee-trigger.html \
            win-celebration.html; do
            if [ ! -f "dist/scenes/${scene}" ]; then
              missing+=("${scene}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::copy-scenes plugin did not produce the following scene files in dist/scenes/:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All How It Works scene files verified in dist/scenes/ ($(ls dist/scenes/*.html | wc -l) total)"
