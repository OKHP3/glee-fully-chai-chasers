name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Set up Node 24 with pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies — a failure here means the lockfile and package.json disagree
        run: pnpm install --frozen-lockfile

      - name: Check mockup component exports — catch missing scene files before merge
        run: |
          pnpm install --filter @workspace/mockup-sandbox --frozen-lockfile
          pnpm --filter @workspace/mockup-sandbox run check-exports

      - name: Typecheck mockup canvas components — catch TS errors before merge
        working-directory: artifacts/mockup-sandbox
        run: pnpm run typecheck

      - name: Run full test suite — catch game logic and UI regressions before merge
        run: pnpm test

      - name: Run slot engine unit tests — catch regressions before merge
        run: pnpm exec vitest run src/engine

      - name: Validate symbol atlas assets — catch a missing or stale generated asset before it ships
        run: pnpm run validate:assets
      - name: Confirm treat-time hand SVG matches board.ts — catch scene/source drift before merge
        run: pnpm run validate:hand-svg
      - name: Confirm SymbolReference pays match PAYTABLE — catch drift after a rebalance
        run: pnpm run validate:symbol-pays
      - name: Confirm SymbolReference reel chips match reels.ts — catch placement drift before it misleads a designer
        run: pnpm run validate:symbol-reels
      - name: Confirm every canvas iframe is in the refresh registry — a missing entry breaks on the next domain change
        run: pnpm run validate:canvas-iframes && node scripts/check-canvas-iframe-registry.mjs --self-test
      - name: Confirm every sandbox scene file has a canvas gallery frame
        run: pnpm run validate:scene-coverage
      - name: Catch a dead export slipping back into symbols.ts or board.ts
        run: pnpm run validate:dead-exports && node scripts/check-dead-exports.mjs --self-test
      - name: Catch a dead CSS selector slipping back into src/style.css
        run: pnpm run validate:dead-css && node scripts/check-dead-css.mjs --self-test
      - name: Catch a stale Keepsake Constellation 2×2 size claim in docs or scenes
        run: pnpm run validate:keepsake-size && node scripts/check-keepsake-constellation-size.mjs --self-test
      - name: Confirm cabinet-strip Sparks values match SPARKS table — catch a drifted scene before merge
        run: pnpm run validate:cabinet-strips

      - name: Catch any third-party CDN URL in shipped code — keep offline-demo resilience and privacy boundary
        run: |
          # scripts/check-cdn-urls.mjs scans every shipped HTML file and stylesheet
          # for URLs that the browser would fetch at runtime:
          #   HTML: <script src="…"> / <link rel="stylesheet|preconnect|preload|…" href="…">
          #   CSS:  @import "…" / url("…") in any property (fonts, backgrounds, …)
          #
          # Meta/OG/Twitter content="…" attributes and JSON-LD are intentionally
          # excluded — they are document metadata, not runtime fetches.
          #
          # Any external URL not in the script's ALLOW_LIST fails CI.  The only
          # permitted entry is the single Google Analytics tag (measurement ID
          # G-89W66VMGPB) approved under Decision S25 in docs/ANALYTICS-PRIVACY.md.
          # No additional tag, CDN library, icon set, or font host may be added
          # without (1) a docs/ANALYTICS-PRIVACY.md update and (2) an ALLOW_LIST entry
          # with a justification comment in scripts/check-cdn-urls.mjs.
          #
          # Google Fonts CDN links (fonts.googleapis.com / fonts.gstatic.com) are
          # caught here along with every other external host — fonts must be
          # self-hosted woff2 files loaded via @font-face in each artifact's
          # public/fonts/.
          node scripts/check-cdn-urls.mjs --self-test
          node scripts/check-cdn-urls.mjs
      - name: Build — catch TypeScript and bundler errors before merge
        run: pnpm run build

      - name: Verify How It Works scene files are present in dist
        run: |
          missing=()
          for scene in \
            bold-chai-pump.html \
            cat-visit-joey.html \
            cat-visit-phoebe.html \
            doorbell-panic.html \
            free-spins-session.html \
            game-base.html \
            joey-laundry.html \
            keepsake-memory.html \
            phoebe-lap-quest.html \
            spin-wheel.html \
            treat-time.html \
            uniglee-trigger.html \
            win-celebration.html; do
            if [ ! -f "dist/scenes/${scene}" ]; then
              missing+=("${scene}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::copy-scenes plugin did not produce the following scene files in dist/scenes/:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All How It Works scene files verified in dist/scenes/ ($(ls dist/scenes/*.html | wc -l) total)"
