name: Verify skill landing

# Triggered three ways:
#
# 1. repository_dispatch type=skillz-push
#    OKHP3/skillz sends its merge-commit SHA via the companion workflow at
#    skills/promotion-handoff/okhp3-skillz-verify-landing.yml.
#    • The SHA is used to locate the matching manifest AND is passed as --ref
#      so verify_skill_landing.py fetches files at that exact commit.
#    • A dispatch that matches no manifest is treated as a FAILURE so a
#      merge with a missing manifest is caught immediately.
#
# 2. workflow_dispatch
#    Manual trigger.  Supply commit_sha to verify a specific skillz commit
#    (manifest-match + --ref); leave it blank to run a full health sweep at
#    each manifest's recorded accepted_commit_or_hash.  Supply manifest to
#    target a single manifest.
#
# 3. push to main (paths filter)
#    Runs when a manifest or the verify script itself changes in this repo.
#    No --ref override is applied; each manifest is verified at its own
#    accepted_commit_or_hash.  No-manifest-found is NOT treated as a
#    failure here because this is a local-repo push, not a skillz dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'skills/promotion-handoff/promotion-manifest-*.json'
      - 'skills/promotion-handoff/verify_skill_landing.py'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >-
          Commit SHA in OKHP3/skillz to match against manifests and pass as
          --ref.  Leave blank to verify all manifests at their stored refs.
        required: false
        default: ''
      manifest:
        description: >-
          Specific manifest filename
          (e.g. promotion-manifest-okhp3-replit-repl-janitor.json).
          Leave blank to scan all manifests.
        required: false
        default: ''
  repository_dispatch:
    types: [skillz-push]

permissions:
  contents: read

jobs:
  verify:
    name: Verify skill landing in OKHP3/skillz
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Resolve which manifests to verify, the skillz ref to pass to --ref,
      # and whether a no-match is a hard failure.
      # -----------------------------------------------------------------------
      - name: Resolve target commit SHA and manifest list
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="skills/promotion-handoff"

          # ── Determine the skillz commit SHA to verify at ───────────────────
          # For repository_dispatch and workflow_dispatch+commit_sha, this is
          # the actual commit in OKHP3/skillz; we will pass it as --ref.
          # For push (local manifest update) or workflow_dispatch without SHA,
          # leave it empty so each manifest is verified at its own stored ref.
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            SKILLZ_SHA="${{ github.event.client_payload.commit_sha }}"
            DISPATCH_MODE="true"   # no-match is a hard failure
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.commit_sha }}" ]]; then
            SKILLZ_SHA="${{ inputs.commit_sha }}"
            DISPATCH_MODE="true"   # caller explicitly targeted a commit
          else
            SKILLZ_SHA=""
            DISPATCH_MODE="false"  # health sweep — no-match is a warning, not a failure
          fi

          echo "skillz_sha=${SKILLZ_SHA}"   >> "$GITHUB_OUTPUT"
          echo "dispatch_mode=${DISPATCH_MODE}" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=${MANIFEST_DIR}" >> "$GITHUB_OUTPUT"

          # ── Specific manifest pinned by workflow_dispatch ──────────────────
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.manifest }}" ]]; then
            SPECIFIC="${MANIFEST_DIR}/${{ inputs.manifest }}"
            if [[ ! -f "${SPECIFIC}" ]]; then
              echo "::error::Requested manifest not found: ${SPECIFIC}"
              exit 1
            fi
            echo "manifests=${SPECIFIC}" >> "$GITHUB_OUTPUT"
            echo "no_match_is_failure=false" >> "$GITHUB_OUTPUT"
            echo "Pinned to manifest: ${SPECIFIC}"
            exit 0
          fi

          # ── Collect all manifests ──────────────────────────────────────────
          ALL_MANIFESTS=$(find "${MANIFEST_DIR}" -maxdepth 1 -name 'promotion-manifest-*.json' | sort)

          if [[ -z "${SKILLZ_SHA}" ]]; then
            # Health sweep — verify everything at its stored ref
            echo "No commit SHA filter — health sweep of all manifests."
            echo "manifests=${ALL_MANIFESTS//$'\n'/ }" >> "$GITHUB_OUTPUT"
            echo "no_match_is_failure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Match manifests by accepted_commit_or_hash ────────────────────
          MATCHED=""
          while IFS= read -r mf; do
            ACCEPTED=$(python3 - "${mf}" <<'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print(data.get("canonical_target", {}).get("accepted_commit_or_hash", ""))
          PYEOF
            )
            if [[ "${ACCEPTED}" == "${SKILLZ_SHA}" ]]; then
              MATCHED="${MATCHED} ${mf}"
              echo "Matched manifest for commit ${SKILLZ_SHA}: ${mf}"
            fi
          done <<< "${ALL_MANIFESTS}"

          if [[ -z "${MATCHED}" ]]; then
            if [[ "${DISPATCH_MODE}" == "true" ]]; then
              # A skillz push arrived but no manifest records this commit.
              # This is a failure — the promotion was not tracked.
              echo "::error::No promotion manifest records commit '${SKILLZ_SHA}'. Either the skill was never promoted via the handoff process, or its manifest is missing. Add or update the manifest before merging."
              echo "manifests=" >> "$GITHUB_OUTPUT"
              echo "no_match_is_failure=true" >> "$GITHUB_OUTPUT"
            else
              # Push-triggered health sweep — no manifest matched this local
              # commit SHA; that is expected.  Fall back to full sweep.
              echo "No manifests matched '${SKILLZ_SHA}' (local push, not a skillz dispatch) — running full health sweep."
              echo "manifests=${ALL_MANIFESTS//$'\n'/ }" >> "$GITHUB_OUTPUT"
              echo "no_match_is_failure=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "manifests=${MATCHED}" >> "$GITHUB_OUTPUT"
            echo "no_match_is_failure=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Hard-fail immediately if dispatch matched no manifest ──────────────
      - name: Fail — no manifest recorded for dispatched commit
        if: steps.resolve.outputs.no_match_is_failure == 'true'
        run: |
          SKILLZ_SHA="${{ steps.resolve.outputs.skillz_sha }}"
          echo "## Skill landing verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger commit:** \`${SKILLZ_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ **FAIL** — No promotion manifest in \`skills/promotion-handoff/\` records" \
               "\`accepted_commit_or_hash: ${SKILLZ_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "A skill was pushed to OKHP3/skillz without a corresponding promotion manifest." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # -----------------------------------------------------------------------
      # Run verify_skill_landing.py for each resolved manifest
      # -----------------------------------------------------------------------
      - name: Run landing verification
        id: run_verify
        if: steps.resolve.outputs.manifests != ''
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        shell: bash
        run: |
          set -uo pipefail

          MANIFESTS="${{ steps.resolve.outputs.manifests }}"
          SKILLZ_SHA="${{ steps.resolve.outputs.skillz_sha }}"
          REPORT_DIR="${RUNNER_TEMP}/landing-reports"
          mkdir -p "${REPORT_DIR}"

          OVERALL_PASS=true

          echo "## Skill landing verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${SKILLZ_SHA}" ]]; then
            echo "**Trigger commit (--ref):** \`${SKILLZ_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Mode:** health sweep (each manifest verified at its stored ref)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skill | Files ✓/total | Aggregate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for MANIFEST in ${MANIFESTS}; do
            BASENAME=$(basename "${MANIFEST}" .json)
            REPORT="${REPORT_DIR}/${BASENAME}.json"

            echo "──────────────────────────────────────────"
            echo "Verifying: ${MANIFEST}"

            # Build the argument list.  Pass --ref only when we have a skillz
            # SHA to verify at; otherwise let the script use the manifest's
            # own accepted_commit_or_hash.
            EXTRA_ARGS=()
            if [[ -n "${SKILLZ_SHA}" ]]; then
              EXTRA_ARGS+=(--ref "${SKILLZ_SHA}")
            fi

            # Run the verifier.  Use a subshell so we can capture the exit
            # code without triggering set -e and aborting the whole loop.
            set +e
            python3 skills/promotion-handoff/verify_skill_landing.py \
              --manifest "${MANIFEST}" \
              --report   "${REPORT}" \
              --token-env GITHUB_PAT \
              "${EXTRA_ARGS[@]}"
            VERIFY_EXIT=$?
            set -e

            # Parse the JSON report (written even on failure).
            if [[ -f "${REPORT}" ]]; then
              SKILL=$(python3 -c \
                "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('skill','?'))" \
                "${REPORT}" 2>/dev/null || echo "?")
              RESULT=$(python3 -c \
                "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('overall','?'))" \
                "${REPORT}" 2>/dev/null || echo "?")
              CHECKED=$(python3 -c \
                "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('files_checked','?'))" \
                "${REPORT}" 2>/dev/null || echo "?")
              PASSED=$(python3 -c \
                "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('files_passed','?'))" \
                "${REPORT}" 2>/dev/null || echo "?")
              AGG=$(python3 -c \
                "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('aggregate',{}).get('status','?'))" \
                "${REPORT}" 2>/dev/null || echo "?")
            else
              # No report written — the script exited with a fatal error (exit 2)
              # before it could produce one.
              SKILL="${MANIFEST}"
              RESULT="ERROR"
              CHECKED="?"
              PASSED="?"
              AGG="?"
            fi

            # Treat any non-zero exit as a failure regardless of report content.
            if [[ "${VERIFY_EXIT}" -ne 0 || "${RESULT}" != "PASS" ]]; then
              ROW_ICON="❌"
              OVERALL_PASS=false
              echo "::error::Landing verification FAILED for ${MANIFEST} (exit ${VERIFY_EXIT}, result ${RESULT})"
            else
              ROW_ICON="✅"
            fi

            echo "| \`${SKILL}\` | ${PASSED}/${CHECKED} | ${AGG} | ${ROW_ICON} ${RESULT} |" \
              >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if $OVERALL_PASS; then
            echo "**Overall: ✅ PASS** — all verified skills landed correctly." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Overall: PASS"
          else
            echo "**Overall: ❌ FAIL** — one or more skills did not land correctly." \
              " Download the \`landing-reports\` artifact for details." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Overall: FAIL"
            echo "overall_fail=true" >> "$GITHUB_OUTPUT"
          fi

          echo "report_dir=${REPORT_DIR}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Upload JSON reports (always, so they survive a failed job)
      # -----------------------------------------------------------------------
      - name: Upload landing reports
        if: always() && steps.run_verify.outputs.report_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: landing-reports
          path: ${{ runner.temp }}/landing-reports/
          if-no-files-found: warn
          retention-days: 30

      # -----------------------------------------------------------------------
      # Fail after uploading so the artifact is always available for inspection
      # -----------------------------------------------------------------------
      - name: Fail if any verification failed
        if: steps.run_verify.outputs.overall_fail == 'true'
        run: |
          echo "::error::One or more skill landings failed verification." \
               "Download the 'landing-reports' artifact for details."
          exit 1
