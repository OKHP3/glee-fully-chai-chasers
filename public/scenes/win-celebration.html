<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Win Celebration (Huge Win) — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:390px;overflow:hidden}</style>
</head>
<body>
<div class="relative h-full w-full flex flex-col text-amber-100 overflow-hidden cc-root" data-theme="dark" data-reduced-motion="false">
  <div class="night-garden" id="bg-layer">
    <div class="aurora-ribbons"><span></span><span></span><span></span></div>
    <div class="star star-fast" style="top:4%;left:3%;animation-delay:0s"></div>
    <div class="star star-slow" style="top:21%;left:44%;animation-delay:0.5s"></div>
    <div class="star star-slow" style="top:38%;left:85%;animation-delay:1s"></div>
    <div class="star star-fast" style="top:55%;left:32%;animation-delay:1.5s"></div>
    <div class="star star-slow" style="top:17%;left:73%;animation-delay:2s"></div>
    <div class="firefly" style="top:45%;left:8%;animation-delay:0s"></div>
    <div class="firefly" style="top:52%;left:61%;animation-delay:0.7s"></div>
    <div class="firefly" style="top:73%;left:52%;animation-delay:2.8s"></div>
  </div>
  <div class="relative z-10 h-full w-full flex flex-col cc-shell">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:0.18s"></span><span class="bulb" style="animation-delay:0.36s"></span><span class="bulb" style="animation-delay:0.54s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:0.18s"></span><span class="bulb" style="animation-delay:0.36s"></span><span class="bulb" style="animation-delay:0.54s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:0.18s"></span><span class="bulb" style="animation-delay:0.36s"></span><span class="bulb" style="animation-delay:0.54s"></span><span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:0.18s"></span><span class="bulb" style="animation-delay:0.36s"></span><span class="bulb" style="animation-delay:0.54s"></span></div>
      <div class="marquee-row">
        <h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1>
        <button class="chrome-btn" aria-label="Open symbol guide and game rules" title="Symbol guide"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 0 5 23z"/><path d="M5 4.5v15M9 8h6M9 12h6"/></svg></button>
        <button class="chrome-btn" aria-label="How it works guide" title="How it works"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11.5v5"/></svg></button>
        <button class="chrome-btn" aria-label="Settings"><svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#f5d576" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg></button>
      </div>
      <div class="marquee-status" aria-live="polite">HUGE WIN! +8,400 coins</div>
    </header>
    <div class="cabinet-shell">
      <div id="bonus-banner" class="bonus-banner" aria-live="polite"><span class="level-chip level-chip--cabinet" aria-label="Player level">Lvl 4<em>120/200 Sparks</em></span></div>
      <div class="cabinet-shell-divider"></div>
      <main class="cabinet-frame">
        <span class="ornament ornament-tl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span><span class="ornament ornament-tr"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span><span class="ornament ornament-bl"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span><span class="ornament ornament-br"><svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M12 1l3 7 7 1-5.2 5 1.5 7.5L12 18l-6.3 3.5L7.2 14 2 9l7-1z" fill="#f5d576" stroke="#2d1f4c" stroke-width="1"/></svg></span>
        <!-- 5×4 winning grid: top row all win-flash (Tumbler 5-of-a-kind), extra cells highlighted -->
        <div id="reel-grid" class="reel-grid" role="img" aria-label="Winning reel board">
          <div class="reel-col" data-reel="0">
            <div class="cell win-flash" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell win-flash" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%" aria-hidden="true"></span></div>
            <div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%" aria-hidden="true"></span></div>
          </div>
          <div class="reel-col" data-reel="1">
            <div class="cell win-flash" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell win-flash" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 33.33%" aria-hidden="true"></span></div>
            <div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 66.67%" aria-hidden="true"></span></div>
          </div>
          <div class="reel-col" data-reel="2">
            <div class="cell win-flash" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell win-flash" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 33.33%" aria-hidden="true"></span></div>
            <div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 66.67%" aria-hidden="true"></span></div>
          </div>
          <div class="reel-col" data-reel="3">
            <div class="cell win-flash" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 66.67%" aria-hidden="true"></span></div>
            <div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%" aria-hidden="true"></span></div>
          </div>
          <div class="reel-col" data-reel="4">
            <div class="cell win-flash" data-row="0"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="1"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 0%" aria-hidden="true"></span></div>
            <div class="cell" data-row="2"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:100% 33.33%" aria-hidden="true"></span></div>
            <div class="cell" data-row="3"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 33.33%" aria-hidden="true"></span></div>
          </div>
        </div>
      </main>
    </div>
    <div class="companion-row">
      <div id="treat-jar" aria-label="Treat Jar" class="treat-jar-housing">
        <span class="treat-jar-title">Treat Jar</span>
        <div class="treat-chips-row">
          <span title="Chicken Comets" class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%" aria-hidden="true"></span></span>3</span>
        </div>
      </div>
      <div class="jar-meter jar-meter--inline" aria-label="Firefly cascade meter">
        <span class="jar-meter-kicker">Firefly Cascade</span>
        <div class="jar-meter-body"><strong class="jar-meter-count">6 / 6</strong></div>
      </div>
      <button aria-label="AskJamie — tap for daily bonus" class="askjamie-housing">
        <div class="askjamie-icon"><picture><source srcset="../assets/optimized/askjamie-avatar.webp" type="image/webp"><img src="../assets/askjamie-avatar.jpg" alt="" class="askjamie-picture" aria-hidden="true"></picture></div>
        <span class="askjamie-label">AskJamie</span>
      </button>
    </div>
    <div id="status-line" class="status-line" aria-live="polite">HUGE WIN! +8,400 coins</div>
    <footer class="bet-console">
      <div class="coin-chip" aria-label="Glee-coin balance">20,880<em>coins</em></div>
      <div class="flex-1"></div>
      <button class="chrome-btn" aria-label="Decrease bet" disabled>−</button>
      <span class="bet-display">50</span>
      <button class="chrome-btn" aria-label="Increase bet" disabled>+</button>
      <button id="sparkle-btn" class="sparkle-btn" disabled><span>SPARKLE!</span></button>
    </footer>
    <aside id="ice-notes-card" class="ice-notes-card" aria-label="Chai ingredient note">
      <p class="ice-notes-eyebrow">ICE NOTES</p>
      <div class="ice-notes-body">
        <div class="ice-notes-header">
          <svg viewBox="0 0 20 20" class="ice-notes-icon" aria-hidden="true"><path d="M10 2.5 11.8 8.2 17.5 10l-5.7 1.8L10 17.5l-1.8-5.7L2.5 10l5.7-1.8Z" fill="currentColor"/></svg>
          <span class="ice-notes-name-group"><span class="ice-notes-name">Huge Win</span> <span class="ice-notes-text">Five-of-a-kind Tumbler across all reels triggers the HUGE WIN celebration — burst dots and all.</span></span>
        </div>
      </div>
    </aside>
  </div>
  <!-- Win tier overlay — position:absolute over .cc-root -->
  <div class="win-tier win-tier-huge" style="position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center" aria-label="Huge win celebration" role="region">
    <div class="win-tier-burst">
      <span class="burst-dot" style="--angle:0deg;--delay:0s"></span><span class="burst-dot" style="--angle:15deg;--delay:.03s"></span><span class="burst-dot" style="--angle:30deg;--delay:.06s"></span><span class="burst-dot" style="--angle:45deg;--delay:.09s"></span><span class="burst-dot" style="--angle:60deg;--delay:.12s"></span><span class="burst-dot" style="--angle:75deg;--delay:.15s"></span><span class="burst-dot" style="--angle:90deg;--delay:.18s"></span><span class="burst-dot" style="--angle:105deg;--delay:0s"></span><span class="burst-dot" style="--angle:120deg;--delay:.03s"></span><span class="burst-dot" style="--angle:135deg;--delay:.06s"></span><span class="burst-dot" style="--angle:150deg;--delay:.09s"></span><span class="burst-dot" style="--angle:165deg;--delay:.12s"></span><span class="burst-dot" style="--angle:180deg;--delay:.15s"></span><span class="burst-dot" style="--angle:195deg;--delay:.18s"></span><span class="burst-dot" style="--angle:210deg;--delay:0s"></span><span class="burst-dot" style="--angle:225deg;--delay:.03s"></span><span class="burst-dot" style="--angle:240deg;--delay:.06s"></span><span class="burst-dot" style="--angle:255deg;--delay:.09s"></span><span class="burst-dot" style="--angle:270deg;--delay:.12s"></span><span class="burst-dot" style="--angle:285deg;--delay:.15s"></span><span class="burst-dot" style="--angle:300deg;--delay:.18s"></span><span class="burst-dot" style="--angle:315deg;--delay:0s"></span><span class="burst-dot" style="--angle:330deg;--delay:.03s"></span><span class="burst-dot" style="--angle:345deg;--delay:.06s"></span>
    </div>
    <div class="win-tier-label">HUGE WIN!</div>
    <div class="win-tier-amount">+8,400 coins</div>
  </div>
</div>
</body>
</html>
