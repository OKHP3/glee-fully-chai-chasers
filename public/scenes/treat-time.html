<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Treat Time — Chai Chasers Design Review</title>
<link rel="stylesheet" href="../game-style.css">
<style>html,body{margin:0;padding:0;width:1280px;height:900px;overflow:hidden;background:#06081a}.cc-root{width:1280px;height:900px}</style>
</head>
<body>
<div class="cc-root">
  <div id="bg-layer" class="night-garden aurora" aria-hidden="true"></div>
  <div class="cc-shell treat-time-main-mode">
    <header class="marquee">
      <div class="marquee-bulbs" aria-hidden="true"><span class="marquee-bulb" style="--blink-delay:0s"></span><span class="marquee-bulb" style="--blink-delay:.07s"></span><span class="marquee-bulb" style="--blink-delay:.14s"></span><span class="marquee-bulb" style="--blink-delay:.21s"></span><span class="marquee-bulb" style="--blink-delay:.28s"></span></div>
      <div class="marquee-row"><h1 class="marquee-title">Glee-fully <span>Chai Chasers</span></h1></div>
      <div id="marquee-status" class="marquee-status">Nighttime Treat Time · Spin 2 of 8</div>
    </header>
    <div class="sidebar-left"><div class="treat-jar-housing"><span class="treat-jar-title">Treat Jar</span><div class="treat-chips-row"><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:0% 100%"></span></span>8</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:33.33% 100%"></span></span>4</span><span class="treat-chip"><span class="treat-icon"><span class="symbol-sprite symbol-sprite--atlas" style="background-image:url('../assets/atlases/standard-symbol-atlas.png');background-size:400% 400%;background-position:66.67% 100%"></span></span>2</span></div></div></div>
    <main class="cabinet-frame treat-time-cabinet">
      <span class="ornament ornament-tl"></span><span class="ornament ornament-tr"></span><span class="ornament ornament-bl"></span><span class="ornament ornament-br"></span>
      <!-- Treat Time entry overlay — appended to .cabinet-frame -->
      <div class="treat-time-entry treat-time-entry--main treat-time-entry--night" style="animation:none;opacity:1">
        <div class="treat-time-entry-hand" aria-hidden="true">
          <!-- hand SVG placeholder; actual game renders treatTimeHandSvg() -->
          <svg viewBox="0 0 120 200" style="width:80px;height:140px;fill:#f2c84b;opacity:0.9">
            <ellipse cx="60" cy="90" rx="35" ry="55" fill="#f5d576"/>
            <rect x="35" y="140" width="50" height="50" rx="8" fill="#e8b84b"/>
            <circle cx="60" cy="60" r="18" fill="#fff8ee" opacity="0.4"/>
          </svg>
        </div>
        <div class="treat-time-entry-copy">
          <div class="treat-time-entry-title">IT'S TREAT TIME!</div>
          <div class="treat-time-entry-sub">Phoebe found the nighttime spread — Joey is awake too!</div>
          <div class="treat-time-entry-spins">8 free spins · every spin gets a treat toss</div>
        </div>
      </div>
      <!-- Reel grid with Treat Time wilds already placed -->
      <div id="reel-grid" class="reel-grid" role="img" aria-label="Treat Time reel board" style="display:none"></div>
    </main>
    <div class="sidebar-right"><div class="firefly-cascade-meter"><div class="cascade-meter-fill" style="height:45%"></div></div></div>
    <div class="hud-row"><span class="level-chip">Level 4</span><div class="status-line">IT'S TREAT TIME! — Nighttime mode · 8 spins · every spin gets a treat toss</div><div class="bet-console"><button class="bet-adj-btn" disabled>−</button><button class="sparkle-btn" disabled>SPARKLE</button><button class="bet-adj-btn" disabled>+</button></div></div>
  </div>
</div>
</body>
</html>
